name: laro-mvp-tracker

services:
    db:
        image: postgres:16
        container_name: laro-db
        restart: unless-stopped
        environment:
            # Creds interpoladas do .env da raiz (ver .env.example). Os defaults
            # servem só para o dev local; na VM defina uma senha própria.
            POSTGRES_USER: ${POSTGRES_USER:-postgres}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
            POSTGRES_DB: ${POSTGRES_DB:-laro}
        # Porta NÃO publicada: o Postgres fica só na rede interna do compose
        # (acesso do host: 'docker compose exec db psql -U postgres -d laro').
        # Para desenvolvimento com o bot rodando no host, descomente:
        # ports:
        #     - '127.0.0.1:5432:5432'
        volumes:
            - laro_pgdata:/var/lib/postgresql/data
            # O entrypoint do postgres aplica os scripts em ordem alfabética
            # na primeira subida (volume vazio): schema + seed LATAM.
            - ./sql/laro.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
            - ./sql/seed_mvp_latam.sql:/docker-entrypoint-initdb.d/02_reseed_mvp_latam.sql:ro
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
            interval: 5s
            timeout: 3s
            retries: 10

    bot:
        build: .
        container_name: laro-bot
        restart: unless-stopped
        depends_on:
            db:
                condition: service_healthy
        # Reinicia container unhealthy (processo vivo mas travado). Requer o
        # servico 'autoheal' abaixo; crash comum ja cubre 'restart'.
        labels:
            - autoheal=true
        env_file:
            - .env
        environment:
            # Sobrescreve a DATABASE_URL do .env: dentro do compose o host é db
            DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-laro}
        healthcheck:
            # 200 só depois do tracker pronto (tracker_ready). HEALTH_PORT=0
            # (servidor de health desligado) conta como saudável. Reinício por
            # travar fica a cargo de restart + docs/hosting-oracle.md.
            test: [
                'CMD-SHELL',
                'if [ "$$HEALTH_PORT" != "0" ]; then python -c "import os, urllib.request; urllib.request.urlopen(''http://localhost:'' + os.environ[''HEALTH_PORT''] + ''/health'', timeout=5)"; fi',
            ]
            interval: 30s
            timeout: 6s
            retries: 3
            start_period: 60s

    autoheal:
        # Vigia containers com label 'autoheal' e reinicia os que o healthcheck
        # marcar como unhealthy (o Docker puro nao faz isso sozinho).
        image: willfarrell/autoheal:latest
        container_name: laro-autoheal
        restart: unless-stopped
        environment:
            # Intervalo em que varre por containers unhealthy
            AUTOHEAL_INTERVAL: '60'
        volumes:
            - /var/run/docker.sock:/var/run/docker.sock

volumes:
    laro_pgdata:
