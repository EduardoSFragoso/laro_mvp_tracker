# CI do laro: lint, formatação e testes em três versões do Python
# (3.13 = legado, 3.14 = venv de dev, 3.15 = imagem Docker/produção).
# Auditoria de dependências roda junto para pegar CVEs cedo.
# Nota: actions/checkout@v7 e actions/setup-python@v7 — conferir versões
# maiores novas quando o Dependabot abrir PR.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.13', '3.14', '3.15']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: src/requirements.lock
      - name: Instalar dependências (lockfile) + ferramentas de dev
        run: pip install -r src/requirements.lock pytest ruff
      - name: Ruff check
        run: ruff check .
      - name: Ruff format
        run: ruff format --check .
      - name: Testes
        run: pytest -q

  types:
    # Escrever types nao varia por versao do Python: um unico job basta.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: src/requirements.lock
      - name: Instalar dependências (lockfile) + pyright no .venv
        # O pyrightconfig.json resolve imports via .venv (venvPath) — mesmo
        # layout do dev. Cria a venv com o mesmo nome para o CI e o dev
        # compartilharem a configuracao.
        run: |
          python -m venv .venv
          .venv/bin/pip install -r src/requirements.lock pyright
      # Usa o pyrightconfig.json da raiz (basic, src+tests)
      - name: Pyright
        run: .venv/bin/pyright

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: pip-audit no lockfile
        run: |
          pip install pip-audit
          pip-audit -r src/requirements.lock --strict
